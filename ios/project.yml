name: Segnavia
options:
  bundleIdPrefix: com.niccolosala
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Segnavia:
    type: application
    platform: iOS
    sources:
      - path: Segnavia
    entitlements:
      path: Segnavia/Segnavia.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Segnavia/Info.plist
      properties:
        CFBundleDisplayName: Segnavia
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location]
        NSHealthShareUsageDescription: "Segnavia legge i tuoi allenamenti di camminata ed escursionismo, con il percorso GPS, per aggiungerli al diario."
        NSHealthUpdateUsageDescription: "Segnavia può salvare in Salute i trekking che registri."
        NSLocationWhenInUseUsageDescription: "Serve per registrare la traccia del trekking e mostrarti dove sei sulla mappa."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Permette di continuare a registrare la traccia anche con lo schermo spento."
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPS Exchange Format
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
              public.mime-type: [application/gpx+xml]
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.topografix.gpx]
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niccolosala.segnavia
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
